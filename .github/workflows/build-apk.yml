name: Build Care Me APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install packages
        run: |
          npm install --no-audit --no-fund
          pip install --quiet pillow

      - name: Signing key (created on the first build, then reused so updates install over old versions)
        run: |
          if [ ! -f tools/debug.keystore.b64 ]; then
            keytool -genkeypair -keystore /tmp/k.jks -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Care Me Sideload,O=Care Me,C=IN"
            base64 -w 76 /tmp/k.jks > tools/debug.keystore.b64
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add tools/debug.keystore.b64
            git commit -m "Add shared sideload signing key [skip ci]"
            git push
          fi

      - name: Generate Android project
        run: |
          npx cap add android
          python3 tools/make_icons.py
          node tools/patch-android.mjs
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../CareMe-v1.0.${{ github.run_number }}.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CareMe-apk
          path: CareMe-v1.0.${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Care Me v1.0.${{ github.run_number }}
          make_latest: true
          files: CareMe-v1.0.${{ github.run_number }}.apk
          body: |
            **Install on Android:** download `CareMe-v1.0.${{ github.run_number }}.apk` below on your phone, open it and allow "Install unknown apps" for your browser once.
            New versions install over the old one — your meals, weights and settings are kept.

            Built from commit ${{ github.sha }}.
